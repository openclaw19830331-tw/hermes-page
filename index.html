<head>

<title>Hermes 狀態頁</title>
<style>
  :root { color-scheme: light dark; }

    font-family: "Noto Sans TC", system-ui, sans-serif;

  <div class="card">
    <p><strong>狀態：</strong><span class="ok">● 運行中</span>（Raspberry Pi）</p>

  </div>

  <div class="card">
    <h2 style="font-size:1.1rem">功能</h2>
